spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          jwk-set-uri: ${OIDC_JWKS_URI}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: crewcaptain

app:
  encryption:
    key: ${ENCRYPTION_KEY:}
  metrics:
    token: ${METRICS_TOKEN:}
  notifications:
    cron: ${NOTIFICATION_CRON:0 0 * * * *}
    due-soon-days: ${NOTIFICATION_DUE_SOON_DAYS:3}
    anniversary-lookahead-days: ${NOTIFICATION_ANNIVERSARY_LOOKAHEAD_DAYS:7}
